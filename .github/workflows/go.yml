name: Go Build & Test

on:
  push:
    branches: [ "main", "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download

      - name: Build Agent
        run: go build -v ./cmd/agent/main.go

      - name: Run Tests
        run: go test -v ./...
